apis:
  identity:
    root: src/identity.yaml
  snapshots:
    root: src/snapshots.yaml
  templates:
    root: src/templates.yaml
  narratives:
    root: src/narratives.yaml
  approvals:
    root: src/approvals.yaml
  deliveries:
    root: src/deliveries.yaml
  reproductions:
    root: src/reproductions.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
