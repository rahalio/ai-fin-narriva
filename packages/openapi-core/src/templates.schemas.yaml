openapi: 3.1.0
info:
  title: Narriva Templates schemas
  version: 0.1.0
paths: {}
components:
  schemas:
    TemplateId:
      type: string
      pattern: '^tpl_[0-9A-HJKMNP-TV-Z]{26}$'
    DisclosureRuleId:
      type: string
      pattern: '^dcl_[0-9A-HJKMNP-TV-Z]{26}$'
    Audience:
      type: string
      enum: [retail_client, advisor, institutional]
    TemplateStatus:
      type: string
      enum: [draft, approved, retired]
    DisclosureRule:
      type: object
      required: [disclosureRuleId, name, body, status]
      properties:
        disclosureRuleId:
          $ref: '#/components/schemas/DisclosureRuleId'
        name:
          type: string
        body:
          type: string
        bannedClaimPatterns:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [draft, approved, retired]
    Template:
      type: object
      required:
        - templateId
        - name
        - audience
        - locale
        - version
        - status
        - body
        - createdAt
        - updatedAt
      properties:
        templateId:
          $ref: '#/components/schemas/TemplateId'
        name:
          type: string
          minLength: 1
          maxLength: 200
        audience:
          $ref: '#/components/schemas/Audience'
        locale:
          type: string
          minLength: 2
          maxLength: 16
          example: en-US
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/TemplateStatus'
        body:
          type: string
          description: Template logic / body with fact slots.
        productRiskTier:
          type: string
          enum: [routine, elevated, high]
          default: routine
        disclosureRuleIds:
          type: array
          items:
            $ref: '#/components/schemas/DisclosureRuleId'
        bannedClaims:
          type: array
          items:
            type: string
        logicOutline:
          type: string
          description: Human-readable template logic for audit (BR-11).
        boundFactKeys:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        approvedAt:
          type: string
          format: date-time
        retiredAt:
          type: string
          format: date-time
    TemplateCreateRequest:
      type: object
      required: [name, audience, locale, body]
      properties:
        name:
          type: string
        audience:
          $ref: '#/components/schemas/Audience'
        locale:
          type: string
        body:
          type: string
        productRiskTier:
          type: string
          enum: [routine, elevated, high]
        disclosureRuleIds:
          type: array
          items:
            $ref: '#/components/schemas/DisclosureRuleId'
        bannedClaims:
          type: array
          items:
            type: string
        logicOutline:
          type: string
        boundFactKeys:
          type: array
          items:
            type: string
    DisclosureRuleCreateRequest:
      type: object
      required: [name, body]
      properties:
        name:
          type: string
        body:
          type: string
        bannedClaimPatterns:
          type: array
          items:
            type: string
    TemplateListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Template'
    DisclosureRuleListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DisclosureRule'
    TemplateResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Template'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
    TemplateListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TemplateListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
    DisclosureRuleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/DisclosureRule'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
    DisclosureRuleListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/DisclosureRuleListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
